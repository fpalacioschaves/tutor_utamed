name: Comprobar Tutor UTAMED

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate -w api
      - run: npm run typecheck
      - run: npm run build
